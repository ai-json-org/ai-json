name: ai.json
description: Validate ai.json, report AI readiness, and optionally run quality gates.
author: ai-json-org

inputs:
  doctor:
    description: Run ai-json doctor.
    required: false
    default: "true"
  check:
    description: Run ai-json check to execute quality.required commands.
    required: false
    default: "false"
  minimum-score:
    description: Minimum doctor readiness score required to pass.
    required: false
    default: "0"

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
    - name: Install ai.json action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm install --frozen-lockfile
    - name: Build ai.json CLI
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm build
    - name: Run ai.json action
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        AI_JSON_ACTION_PATH: ${{ github.action_path }}
        INPUT_DOCTOR: ${{ inputs.doctor }}
        INPUT_CHECK: ${{ inputs.check }}
        INPUT_MINIMUM_SCORE: ${{ inputs.minimum-score }}
      run: node "$AI_JSON_ACTION_PATH/scripts/github-action.mjs"
